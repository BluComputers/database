<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Fleet Manager</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --warning: #f39c12; --bg: #f4f7f6; --plate: #f9d71c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .container { max-width: 1300px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85em; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-add { background: var(--success); }
        .btn-edit { background: var(--warning); margin-right: 5px; }
        .btn-delete { background: var(--danger); }
        .reg-plate { background: var(--plate); color: #000; padding: 4px 10px; border-radius: 4px; font-family: 'Arial Black', sans-serif; border: 1px solid #000; text-transform: uppercase; font-size: 1.1em; display: inline-block; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; color: white; display: inline-block; }
        .loading { text-align: center; padding: 40px; font-weight: bold; color: var(--accent); font-size: 1.2em; }
        .search-container { margin-bottom: 20px; }
        #searchInput { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 id="formTitle">Add New Vehicle</h2>
        <form id="vehicleForm">
            <div class="grid-form">
                <div class="form-group"><label>Registration *</label><input type="text" id="reg" required placeholder="e.g. AB12 CDE"></div>
                <div class="form-group"><label>Make *</label><input type="text" id="make" required></div>
                <div class="form-group"><label>Model</label><input type="text" id="model"></div>
                <div class="form-group"><label>VIN</label><input type="text" id="vin"></div>
                <div class="form-group"><label>Tail Lift</label><select id="tailLift"><option value="No">No</option><option value="Yes">Yes</option></select></div>
                <div class="form-group"><label>MOT Expiry</label><input type="date" id="mot"></div>
                <div class="form-group"><label>Status</label><select id="status"><option value="In Service">In Service</option><option value="Out of Service">Out of Service</option></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                <div class="form-group"><label>Inspection Links (One per line)</label><textarea id="inspLinks" rows="3" placeholder="https://files.fm/..."></textarea></div>
                <div class="form-group"><label>Job Card Links (One per line)</label><textarea id="jobLinks" rows="3" placeholder="https://files.fm/..."></textarea></div>
            </div>
            <div class="form-group" style="margin-top:10px;"><label>Comments</label><textarea id="comments" rows="2"></textarea></div>
            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-add" id="submitBtn">Save to Cloud</button>
                <button type="button" class="btn" style="background:#95a5a6; display:none;" id="cancelEdit" onclick="resetForm()">Cancel Edit</button>
            </div>
        </form>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by Reg, Make, or VIN..." onkeyup="renderTable()">
    </div>

    <div class="card" style="padding:0; overflow-x:auto;">
        <div id="loader" class="loading">📡 Connecting to Fleet Cloud...</div>
        <table id="mainTable" style="display:none;">
            <thead>
                <tr>
                    <th>Reg / Status</th>
                    <th>Vehicle Details</th>
                    <th>VIN</th>
                    <th>Tail Lift</th>
                    <th>MOT</th>
                    <th>Documents</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
  // Firebase SDK Imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // Your Specific Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCDnBcdF04umCvU9HPy9uxrTjRxrTEA5Ns",
    authDomain: "fleet-database-68020.firebaseapp.com",
    databaseURL: "https://fleet-database-68020-default-rtdb.firebaseio.com",
    projectId: "fleet-database-68020",
    storageBucket: "fleet-database-68020.firebasestorage.app",
    messagingSenderId: "487214984962",
    appId: "1:487214984962:web:542f8a959c804a6afa1c1b",
    measurementId: "G-SPP8SFSYWK"
  };

  // Initialize
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const vehicleRef = ref(db, 'vehicles');

  let vehicles = {};
  let editId = null;

  // Sync with Cloud
  onValue(vehicleRef, (snapshot) => {
    vehicles = snapshot.val() || {};
    document.getElementById('loader').style.display = 'none';
    document.getElementById('mainTable').style.display = 'table';
    renderTable();
  });

  const vehicleForm = document.getElementById('vehicleForm');

  // Logic to display table
  window.renderTable = function() {
    const tbody = document.getElementById('tableBody');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    tbody.innerHTML = '';
    
    Object.keys(vehicles).forEach((id) => {
        const v = vehicles[id];
        // Search filter
        if (v.reg.toLowerCase().includes(searchTerm) || v.make.toLowerCase().includes(searchTerm) || (v.vin && v.vin.toLowerCase().includes(searchTerm))) {
            const statusColor = v.status === 'In Service' ? '#27ae60' : '#e74c3c';
            
            const inspLinks = v.inspLinks ? v.inspLinks.map((l, i) => `<a href="${l}" target="_blank" style="display:block; font-size:11px; color:#3498db; margin-bottom:2px;">📄 Inspection ${i+1}</a>`).join('') : 'None';
            const jobLinks = v.jobLinks ? v.jobLinks.map((l, i) => `<a href="${l}" target="_blank" style="display:block; font-size:11px; color:#3498db; margin-bottom:2px;">🛠 Job Card ${i+1}</a>`).join('') : 'None';

            tbody.innerHTML += `
                <tr>
                    <td>
                        <div style="margin-bottom:8px"><span class="reg-plate">${v.reg}</span></div>
                        <span class="status-pill" style="background:${statusColor}">${v.status}</span>
                    </td>
                    <td><strong>${v.make}</strong><br>${v.model}</td>
                    <td><small style="font-family:monospace">${v.vin || 'N/A'}</small></td>
                    <td>${v.tailLift}</td>
                    <td>${v.mot || 'N/A'}</td>
                    <td>
                        <div style="margin-bottom:8px"><strong>Inspections:</strong><br>${inspHtml(v.inspLinks)}</div>
                        <div><strong>Job Cards:</strong><br>${jobHtml(v.jobLinks)}</div>
                    </td>
                    <td>
                        <button class="btn btn-edit" onclick="editVehicle('${id}')">Edit</button>
                        <button class="btn btn-delete" onclick="deleteVehicle('${id}')">Del</button>
                    </td>
                </tr>
                <tr style="background:#fcfcfc;">
                    <td colspan="7" style="font-size:0.85em; color:#666; border-bottom: 2px solid #eee; padding: 5px 12px;">
                        <strong>Notes:</strong> ${v.comments || 'No comments recorded.'}
                    </td>
                </tr>
            `;
        }
    });
  }

  function inspHtml(links) {
      if(!links) return '<span style="color:#ccc">None</span>';
      return links.map((l, i) => `<a href="${l}" target="_blank" style="text-decoration:none; display:block; font-size:11px; color:#3498db;">📄 File ${i+1}</a>`).join('');
  }

  function jobHtml(links) {
      if(!links) return '<span style="color:#ccc">None</span>';
      return links.map((l, i) => `<a href="${l}" target="_blank" style="text-decoration:none; display:block; font-size:11px; color:#3498db;">🛠 File ${i+1}</a>`).join('');
  }

  // Submit/Update Form
  vehicleForm.onsubmit = function(e) {
    e.preventDefault();
    const vData = {
        reg: document.getElementById('reg').value.toUpperCase(),
        make: document.getElementById('make').value,
        model: document.getElementById('model').value,
        vin: document.getElementById('vin').value,
        tailLift: document.getElementById('tailLift').value,
        mot: document.getElementById('mot').value,
        status: document.getElementById('status').value,
        comments: document.getElementById('comments').value,
        inspLinks: document.getElementById('inspLinks').value.split('\n').filter(l => l.trim() !== ""),
        jobLinks: document.getElementById('jobLinks').value.split('\n').filter(l => l.trim() !== "")
    };

    if (editId) {
        update(ref(db, 'vehicles/' + editId), vData)
            .then(() => alert("Vehicle Updated!"))
            .catch((error) => alert("Update failed: " + error.message));
        editId = null;
    } else {
        push(vehicleRef, vData)
            .then(() => alert("Vehicle Saved to Cloud!"))
            .catch((error) => alert("Save failed: " + error.message));
    }

    resetForm();
  };

  // Global functions for buttons
  window.editVehicle = function(id) {
    editId = id;
    const v = vehicles[id];
    document.getElementById('reg').value = v.reg;
    document.getElementById('make').value = v.make;
    document.getElementById('model').value = v.model;
    document.getElementById('vin').value = v.vin;
    document.getElementById('tailLift').value = v.tailLift;
    document.getElementById('mot').value = v.mot;
    document.getElementById('status').value = v.status;
    document.getElementById('comments').value = v.comments;
    document.getElementById('inspLinks').value = v.inspLinks ? v.inspLinks.join('\n') : '';
    document.getElementById('jobLinks').value = v.jobLinks ? v.jobLinks.join('\n') : '';

    document.getElementById('formTitle').innerText = "Editing Vehicle: " + v.reg;
    document.getElementById('submitBtn').innerText = "Update Cloud Records";
    document.getElementById('cancelEdit').style.display = "inline-block";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  window.deleteVehicle = function(id) {
    if(confirm("Are you sure? This deletes the vehicle from the cloud database permanently.")) {
        remove(ref(db, 'vehicles/' + id));
    }
  }

  window.resetForm = function() {
    editId = null;
    vehicleForm.reset();
    document.getElementById('formTitle').innerText = "Add New Vehicle";
    document.getElementById('submitBtn').innerText = "Save to Cloud";
    document.getElementById('cancelEdit').style.display = "none";
  }
</script>
</body>
</html>
