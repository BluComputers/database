<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Fleet Manager</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --banner-blue: #002b5c; 
            --accent: #3498db; 
            --success: #27ae60; 
            --danger: #e74c3c; 
            --warning: #f39c12; 
            --bg: #f4f7f6; 
            --plate: #f9d71c; 
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        .top-left { position: absolute; top: 10px; left: 15px; display: flex; flex-direction: column; align-items: flex-start; z-index: 10; }
        .top-right { position: absolute; top: 15px; right: 20px; text-align: right; color: white; z-index: 10; line-height: 1.4; }
        
        .logo { width: 80px; height: auto; border-radius: 4px; }
        .copyright { font-size: 10px; color: white; margin-top: 4px; font-weight: bold; }

        .license-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .license-name { font-size: 14px; font-weight: bold; color: var(--accent); }
        .license-exp { font-size: 10px; font-style: italic; opacity: 0.8; }

        .banner { background: var(--banner-blue); color: white; text-align: center; padding: 40px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .banner h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }
        .banner #liveClock { font-size: 1.1em; margin-top: 10px; font-weight: 300; opacity: 0.9; }

        .button-nav { text-align: center; padding: 20px 0; }
        .nav-btn { padding: 12px 30px; margin: 0 10px; border-radius: 6px; text-decoration: none; font-weight: bold; color: white; display: inline-block; transition: 0.3s; }
        .btn-gtt { background: var(--banner-blue); border: 2px solid var(--warning); color: var(--warning); }
        .btn-gtt:hover { background: var(--warning); color: white; }
        .btn-wnct { background: var(--banner-blue); border: 2px solid var(--accent); color: var(--accent); }
        .btn-wnct:hover { background: var(--accent); color: white; }

        /* Mini Buttons for Table */
        .btn-mini { padding: 4px 8px; font-size: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; display: inline-block; margin: 2px; }
        .mini-gtt { border: 1px solid var(--warning); color: var(--warning); }
        .mini-gtt:hover { background: var(--warning); color: white; }
        .mini-wnct { border: 1px solid var(--accent); color: var(--accent); }
        .mini-wnct:hover { background: var(--accent); color: white; }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 40px 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85em; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-add { background: var(--success); }
        .btn-edit { background: var(--warning); margin-right: 5px; }
        .btn-delete { background: var(--danger); }
        
        .reg-plate { background: var(--plate); color: #000; padding: 4px 10px; border-radius: 4px; font-family: 'Arial Black', sans-serif; border: 1px solid #000; text-transform: uppercase; font-size: 1.1em; display: inline-block; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; color: white; display: inline-block; }
        .loading { text-align: center; padding: 40px; font-weight: bold; color: var(--accent); font-size: 1.2em; }
        #searchInput { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="top-left">
    <img src="https://files.fm/thumb_show.php?i=cctb85fdph" alt="Logo" class="logo">
    <div class="copyright">&copy; 2026 - A Blu Computers Program</div>
</div>

<div class="top-right">
    <div class="license-title">Licensed to</div>
    <div class="license-name">WNCT / GTT</div>
    <div class="license-exp">exp 15/05/2027</div>
</div>

<div class="banner">
    <h1><b>Cloud Fleet Manager</b></h1>
    <div id="liveClock">Loading Date & Time...</div>
</div>

<div class="button-nav">
    <a href="https://files.fm/u/zwvhwhujv8mq33vr" target="_blank" class="nav-btn btn-gtt">GTT DOCUMENTATION</a>
    <a href="https://files.fm/u/n9xhav2vt3hd9q3c" target="_blank" class="nav-btn btn-wnct">WNCT DOCUMENTATION</a>
</div>

<div class="container">
    <div class="card">
        <h3 id="formTitle">Add New Vehicle</h3>
        <form id="vehicleForm">
            <div class="grid-form">
                <div class="form-group"><label>Registration *</label><input type="text" id="reg" required></div>
                <div class="form-group"><label>Make *</label><input type="text" id="make" required></div>
                <div class="form-group"><label>Model</label><input type="text" id="model"></div>
                <div class="form-group"><label>VIN</label><input type="text" id="vin"></div>
                <div class="form-group"><label>Tail Lift</label><select id="tailLift"><option value="No">No</option><option value="Yes">Yes</option></select></div>
                <div class="form-group"><label>MOT Expiry</label><input type="date" id="mot"></div>
                <div class="form-group"><label>Status</label><select id="status"><option value="In Service">In Service</option><option value="Out of Service">Out of Service</option></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                <div class="form-group"><label>Inspection Links (One per line)</label><textarea id="inspLinks" rows="3"></textarea></div>
                <div class="form-group"><label>Job Card Links (One per line)</label><textarea id="jobLinks" rows="3"></textarea></div>
            </div>
            <div class="form-group" style="margin-top:10px;"><label>Comments</label><textarea id="comments" rows="2"></textarea></div>
            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-add" id="submitBtn">Save to Cloud</button>
                <button type="button" class="btn" style="background:#95a5a6; display:none;" id="cancelEdit" onclick="resetForm()">Cancel Edit</button>
            </div>
        </form>
    </div>

    <input type="text" id="searchInput" placeholder="Search Registration, Make or Model..." onkeyup="renderTable()">

    <div class="card" style="padding:0; overflow-x:auto;">
        <div id="loader" class="loading">Connecting to Fleet Cloud...</div>
        <table id="mainTable" style="display:none;">
            <thead>
                <tr>
                    <th>Reg / Status</th>
                    <th>Vehicle</th>
                    <th>VIN</th>
                    <th>Tail Lift</th>
                    <th>MOT</th>
                    <th>Files</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCDnBcdF04umCvU9HPy9uxrTjRxrTEA5Ns",
    authDomain: "fleet-database-68020.firebaseapp.com",
    databaseURL: "https://fleet-database-68020-default-rtdb.firebaseio.com",
    projectId: "fleet-database-68020",
    storageBucket: "fleet-database-68020.firebasestorage.app",
    messagingSenderId: "487214984962",
    appId: "1:487214984962:web:542f8a959c804a6afa1c1b",
    measurementId: "G-SPP8SFSYWK"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const vehicleRef = ref(db, 'vehicles');

  let vehicles = {};
  let editId = null;

  function updateClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('liveClock').innerText = now.toLocaleDateString('en-GB', options);
  }
  setInterval(updateClock, 1000);
  updateClock();

  onValue(vehicleRef, (snapshot) => {
    vehicles = snapshot.val() || {};
    document.getElementById('loader').style.display = 'none';
    document.getElementById('mainTable').style.display = 'table';
    renderTable();
  });

  window.renderTable = function() {
    const tbody = document.getElementById('tableBody');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    tbody.innerHTML = '';
    
    Object.keys(vehicles).forEach((id) => {
        const v = vehicles[id];
        if (v.reg.toLowerCase().includes(searchTerm) || v.make.toLowerCase().includes(searchTerm)) {
            const statusColor = v.status === 'In Service' ? '#27ae60' : '#e74c3c';
            
            tbody.innerHTML += `
                <tr>
                    <td>
                        <div style="margin-bottom:5px"><span class="reg-plate">${v.reg}</span></div>
                        <span class="status-pill" style="background:${statusColor}">${v.status}</span>
                    </td>
                    <td><strong>${v.make}</strong><br>${v.model}</td>
                    <td><small>${v.vin || '-'}</small></td>
                    <td>${v.tailLift}</td>
                    <td>${v.mot || '-'}</td>
                    <td>
                        <a href="https://files.fm/u/gkbh2jhgwu" target="_blank" class="btn-mini mini-gtt">GTT</a>
                        <a href="https://files.fm/u/9bhkf9vwun" target="_blank" class="btn-mini mini-wnct">WNCT</a>
                    </td>
                    <td>
                        <button class="btn btn-edit" onclick="editVehicle('${id}')">Edit</button>
                        <button class="btn btn-delete" onclick="deleteVehicle('${id}')">Del</button>
                    </td>
                </tr>
                <tr style="background:#f9f9f9; font-size:0.8em; color:#666;">
                    <td colspan="7" style="padding: 5px 15px;"><strong>Comments:</strong> ${v.comments || 'N/A'}</td>
                </tr>
            `;
        }
    });
  }

  document.getElementById('vehicleForm').onsubmit = function(e) {
    e.preventDefault();
    const vData = {
        reg: document.getElementById('reg').value.toUpperCase(),
        make: document.getElementById('make').value,
        model: document.getElementById('model').value,
        vin: document.getElementById('vin').value,
        tailLift: document.getElementById('tailLift').value,
        mot: document.getElementById('mot').value,
        status: document.getElementById('status').value,
        comments: document.getElementById('comments').value,
        inspLinks: document.getElementById('inspLinks').value.split('\n').filter(l => l.trim() !== ""),
        jobLinks: document.getElementById('jobLinks').value.split('\n').filter(l => l.trim() !== "")
    };

    if (editId) {
        update(ref(db, 'vehicles/' + editId), vData);
        editId = null;
    } else {
        push(vehicleRef, vData);
    }
    resetForm();
  };

  window.editVehicle = function(id) {
    editId = id;
    const v = vehicles[id];
    document.getElementById('reg').value = v.reg;
    document.getElementById('make').value = v.make;
    document.getElementById('model').value = v.model;
    document.getElementById('vin').value = v.vin;
    document.getElementById('tailLift').value = v.tailLift;
    document.getElementById('mot').value = v.mot;
    document.getElementById('status').value = v.status;
    document.getElementById('comments').value = v.comments;
    document.getElementById('inspLinks').value = v.inspLinks ? v.inspLinks.join('\n') : '';
    document.getElementById('jobLinks').value = v.jobLinks ? v.jobLinks.join('\n') : '';

    document.getElementById('formTitle').innerText = "Edit Vehicle " + v.reg;
    document.getElementById('submitBtn').innerText = "Update Cloud Record";
    document.getElementById('cancelEdit').style.display = "inline-block";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  window.deleteVehicle = function(id) {
    if(confirm("Permanently delete this vehicle from cloud?")) {
        remove(ref(db, 'vehicles/' + id));
    }
  }

  window.resetForm = function() {
    editId = null;
    document.getElementById('vehicleForm').reset();
    document.getElementById('formTitle').innerText = "Add New Vehicle";
    document.getElementById('submitBtn').innerText = "Save to Cloud";
    document.getElementById('cancelEdit').style.display = "none";
  }
</script>
</body>
</html>
