<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Manager Pro v2.1</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --danger: #e74c3c; --warning: #f39c12; --bg: #f4f7f6; --plate: #f9d71c;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85em; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-add { background: var(--success); }
        .btn-edit { background: var(--warning); margin-right: 5px; }
        .btn-delete { background: var(--danger); }
        .reg-plate { background: var(--plate); color: #000; padding: 4px 10px; border-radius: 4px; font-family: 'Arial Black', sans-serif; border: 1px solid #000; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 id="formTitle">Add New Vehicle</h2>
        <form id="vehicleForm">
            <div class="grid-form">
                <div class="form-group"><label>Registration *</label><input type="text" id="reg" required placeholder="e.g. AB12 CDE"></div>
                <div class="form-group"><label>Make *</label><input type="text" id="make" required></div>
                <div class="form-group"><label>Model</label><input type="text" id="model"></div>
                <div class="form-group"><label>VIN</label><input type="text" id="vin"></div>
                <div class="form-group"><label>Tail Lift</label><select id="tailLift"><option value="No">No</option><option value="Yes">Yes</option></select></div>
                <div class="form-group"><label>MOT Expiry</label><input type="date" id="mot"></div>
                <div class="form-group"><label>Status</label><select id="status"><option value="In Service">In Service</option><option value="Out of Service">Out of Service</option></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                <div class="form-group"><label>Inspection Links (One per line)</label><textarea id="inspLinks" rows="3"></textarea></div>
                <div class="form-group"><label>Job Card Links (One per line)</label><textarea id="jobLinks" rows="3"></textarea></div>
            </div>
            <div class="form-group" style="margin-top:10px;"><label>Comments</label><textarea id="comments" rows="2"></textarea></div>
            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-add" id="submitBtn">Save Vehicle</button>
                <button type="button" class="btn" style="background:#95a5a6; display:none;" id="cancelEdit" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>

    <div class="card" style="padding:0; overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Reg / Status</th>
                    <th>Make & Model</th>
                    <th>VIN</th>
                    <th>Tail Lift</th>
                    <th>MOT</th>
                    <th>Documents</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let vehicles = [];
    let editIndex = null;

    // Load data safely
    try {
        const savedData = localStorage.getItem('fleetData');
        if (savedData) vehicles = JSON.parse(savedData);
    } catch (e) {
        console.error("Could not load data", e);
    }

    const vehicleForm = document.getElementById('vehicleForm');

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        vehicles.forEach((v, index) => {
            const statusColor = v.status === 'In Service' ? '#27ae60' : '#e74c3c';
            const inspLinks = v.inspLinks ? v.inspLinks.map(l => `<a href="${l}" target="_blank" style="display:block; font-size:11px;">📄 Inspection</a>`).join('') : '';
            const jobLinks = v.jobLinks ? v.jobLinks.map(l => `<a href="${l}" target="_blank" style="display:block; font-size:11px;">🛠 Job Card</a>`).join('') : '';

            tbody.innerHTML += `
                <tr>
                    <td><div style="margin-bottom:5px"><span class="reg-plate">${v.reg}</span></div>
                        <span class="status-pill" style="background:${statusColor}">${v.status}</span></td>
                    <td><strong>${v.make}</strong><br>${v.model}</td>
                    <td><small>${v.vin}</small></td>
                    <td>${v.tailLift}</td>
                    <td>${v.mot || 'N/A'}</td>
                    <td>${inspLinks}${jobLinks}</td>
                    <td>
                        <button class="btn btn-edit" onclick="editVehicle(${index})">Edit</button>
                        <button class="btn btn-delete" onclick="deleteVehicle(${index})">Del</button>
                    </td>
                </tr>
            `;
        });
    }

    vehicleForm.onsubmit = function(e) {
        e.preventDefault();
        
        try {
            const vData = {
                reg: document.getElementById('reg').value,
                make: document.getElementById('make').value,
                model: document.getElementById('model').value,
                vin: document.getElementById('vin').value,
                tailLift: document.getElementById('tailLift').value,
                mot: document.getElementById('mot').value,
                status: document.getElementById('status').value,
                comments: document.getElementById('comments').value,
                inspLinks: document.getElementById('inspLinks').value.split('\n').filter(l => l.trim() !== ""),
                jobLinks: document.getElementById('jobLinks').value.split('\n').filter(l => l.trim() !== "")
            };

            if (editIndex !== null) {
                vehicles[editIndex] = vData;
                alert("Vehicle Updated!");
            } else {
                vehicles.push(vData);
                alert("Vehicle Added Successfully!");
            }

            localStorage.setItem('fleetData', JSON.stringify(vehicles));
            resetForm();
            renderTable();
        } catch (err) {
            alert("Error saving: " + err.message);
        }
    };

    function editVehicle(index) {
        editIndex = index;
        const v = vehicles[index];
        document.getElementById('reg').value = v.reg;
        document.getElementById('make').value = v.make;
        document.getElementById('model').value = v.model;
        document.getElementById('vin').value = v.vin;
        document.getElementById('tailLift').value = v.tailLift;
        document.getElementById('mot').value = v.mot;
        document.getElementById('status').value = v.status;
        document.getElementById('comments').value = v.comments;
        document.getElementById('inspLinks').value = v.inspLinks ? v.inspLinks.join('\n') : '';
        document.getElementById('jobLinks').value = v.jobLinks ? v.jobLinks.join('\n') : '';

        document.getElementById('formTitle').innerText = "Edit Vehicle";
        document.getElementById('submitBtn').innerText = "Update Vehicle";
        document.getElementById('cancelEdit').style.display = "inline-block";
        window.scrollTo(0,0);
    }

    function deleteVehicle(index) {
        if(confirm("Delete this vehicle?")) {
            vehicles.splice(index, 1);
            localStorage.setItem('fleetData', JSON.stringify(vehicles));
            renderTable();
        }
    }

    function resetForm() {
        editIndex = null;
        vehicleForm.reset();
        document.getElementById('formTitle').innerText = "Add New Vehicle";
        document.getElementById('submitBtn').innerText = "Save Vehicle";
        document.getElementById('cancelEdit').style.display = "none";
    }

    renderTable();
</script>
</body>
</html>
